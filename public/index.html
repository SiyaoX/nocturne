<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nocturne</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>nocturne</h1>
      <p>Human-directed local workspace for multi-LLM routing</p>
      <p id="status" role="status" aria-live="polite"></p>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Inbox</h2>
        <form id="inbox-form" class="stack">
          <input id="source" type="text" placeholder="Source (e.g. ChatGPT, Claude)" />
          <textarea id="inbox-content" placeholder="Paste output here" required></textarea>
          <button type="submit">Add to inbox</button>
        </form>
        <ul id="inbox-list" class="stack"></ul>
      </section>

      <section class="panel">
        <h2>Prompt composer</h2>
        <div class="stack">
          <textarea id="instruction" placeholder="Instruction for next model"></textarea>
          <button id="compose-button" type="button">Compose prompt from selected inbox items</button>
        </div>
      </section>

      <section class="panel">
        <h2>Output / copy</h2>
        <div class="stack">
          <textarea id="composed-output" placeholder="Composed prompt appears here"></textarea>
          <textarea id="llm-output" placeholder="Paste final LLM output here (optional)"></textarea>
          <button id="copy-button" type="button">Copy prompt</button>
          <input id="history-title" type="text" placeholder="History title" />
          <select id="history-type">
            <option value="task">task</option>
            <option value="report">report</option>
            <option value="decision">decision</option>
          </select>
          <button id="save-history-button" type="button">Save to history</button>
        </div>
      </section>
    </main>

    <section class="panel history-panel">
      <h2>History archive</h2>
      <ul id="history-list" class="stack"></ul>
    </section>

    <script src="app.js"></script>
  </body>
</html>
